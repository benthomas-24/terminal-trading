[project]
name = "terminal-trading"
version = "0.1.0"
description = "Terminal UI for Public.com brokerage — built with Textual"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "yfinance>=1.4.1",
    "textual-plotext>=1.0.1",
    "textual-autocomplete>=4.0.6",
    "anthropic>=0.105.2",
]

[project.scripts]
tt = "tt.main:main"

[tool.hatch.build.targets.wheel]
packages = ["tt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
